# Builds the static website (public/ + Supabase settings from site.config.json)
# on every push to main and publishes it to the gh-pages branch.
# GitHub Pages serves that branch: Settings → Pages → Deploy from a branch → gh-pages / (root).
name: Build and publish the website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the website
        run: node scripts/build-site.js --out site-build

      - name: Publish to the gh-pages branch
        working-directory: site-build
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Website built from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
