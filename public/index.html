<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Sign in · Genesis Hackathon</title>
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preload" href="/fonts/big-shoulders-display-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <main class="signin">
    <section class="signin-hero">
      <div class="lockup">
        <img class="hero-logo" src="/img/logo.png" alt="Genesis logo" width="352" height="568">
        <div>
          <h1 class="wordmark" id="wordmark"><span>Genesis</span><span>Hackathon</span></h1>
          <p class="signin-tagline" id="tagline">24 hours to build what comes next.</p>
        </div>
      </div>

      <div class="stack">
        <div class="horizon" id="horizon" aria-label="Event progress">
          <div class="horizon-top">
            <span class="muted" data-h-label>Event clock</span>
            <span class="mono" data-h-time>--:--:--</span>
          </div>
          <div class="horizon-bar"><i></i></div>
          <div class="horizon-scale" id="horizon-scale"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>24h</span></div>
        </div>
        <div class="facts" id="facts"></div>
      </div>
    </section>

    <section class="signin-panel">
      <form class="card signin-card" id="login-form" novalidate>
        <div class="stack-sm">
          <h1>Sign in</h1>
          <p class="muted small">Use the login details the organisers gave you.</p>
        </div>

        <div class="seg" role="group" aria-label="Sign in as">
          <button type="button" data-role="team" aria-pressed="true">Team leader</button>
          <button type="button" data-role="admin" aria-pressed="false">Organiser</button>
        </div>

        <label class="field">
          <span id="user-label">Team ID</span>
          <input class="input" id="username" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="e.g. GEN014" required>
        </label>

        <label class="field">
          <span>Password</span>
          <span class="pw-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="icon-btn" id="pw-toggle" aria-label="Show password"></button>
          </span>
        </label>

        <div class="form-error" id="login-error" role="alert"></div>
        <button class="btn btn-primary btn-block" type="submit" id="login-btn">Sign in</button>
        <p class="signin-foot" id="login-foot">Forgot your password? An organiser can reset it for you.</p>
      </form>
    </section>
  </main>
</body>
</html>
